name: Kvízy verification
on: [push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kvizy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify repeat import
        run: |
          npm run import:quizzes
          npm run import:quizzes
      - run: npm run check
